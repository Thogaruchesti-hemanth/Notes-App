// Apply Android application plugin
apply plugin: 'com.android.application'

// Load keystore properties for signing (release builds)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')

// Load keystore only if file exists
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    // App namespace (recommended instead of package)
    namespace 'com.example.NotesNest'

    // Compile SDK version
    compileSdk 36

    // Enable viewBinding
    buildFeatures {
        viewBinding true
    }

    // Signing configuration for release APK
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'key.properties')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    defaultConfig {
        applicationId "com.hemanth.NotesNest"
        minSdk 29
        targetSdk 35

        versionCode 10
        versionName "3.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        release {
            // Use release signing
            signingConfig signingConfigs.release

            // Disable cleartext traffic for security (Play Store requirement)
            manifestPlaceholders = [usesCleartextTraffic: "false"]

            // Enable R8 code shrinking & optimization
            minifyEnabled true

            // Remove unused resources to reduce APK size
            shrinkResources true

            // Use default R8 + custom rules file
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }

        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
    }

    // Java compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            pickFirsts += ["META-INF/*"]
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }
}

dependencies {

    // ------- AndroidX Core UI Libraries -------
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'com.google.android.material:material:1.12.0'

    // ------- Room Database -------
    def room_version = "2.8.3"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // ------- WorkManager -------
    implementation libs.work.runtime

    // ------- Firebase (using latest recommended versions) -------
    implementation platform('com.google.firebase:firebase-bom:33.6.0')

    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.api-client:google-api-client-android:2.2.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20230212-2.0.0'

    // Add Firebase Analytics ONLY if you need it:
    // implementation 'com.google.firebase:firebase-analytics-ktx'

    // ------- Google Sign-In -------
    // Use ONLY latest version (removed duplicate older version)
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    // ------- WebKit -------
    implementation "androidx.webkit:webkit:1.14.0"

    // ------- UI Components -------
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // ------- Security -------
    implementation 'androidx.security:security-crypto:1.1.0-alpha03'

    // ------- Image Loading -------
    implementation 'com.squareup.picasso:picasso:2.8'

    // ------- Testing -------
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'
